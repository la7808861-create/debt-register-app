<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سجل الديون</title>
    <meta name="theme-color" content="#082846" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="phone-shell">
      <section class="app">
        <header class="topbar">
          <div class="logo" aria-hidden="true"><span class="paper"></span><span class="coins"></span></div>
          <div><p>كل حساب تحت السيطرة</p><h1>سجل الديون</h1></div>
        </header>

        <label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="ابحث باسم العميل أو الهاتف" /></label>

        <section class="stats">
          <article class="stat blue"><small>العملاء</small><strong id="customersCount">0</strong></article>
          <article class="stat red"><small>إجمالي الديون</small><strong id="totalDebt">0</strong></article>
          <article class="stat green"><small>المدفوع</small><strong id="totalPaid">0</strong></article>
          <article class="stat orange"><small>المتبقي</small><strong id="remainingDebt">0</strong></article>
        </section>

        <section class="quick-actions">
          <button data-open="customerModal"><span>＋</span>عميل جديد</button>
          <button data-open="debtModal"><span>▤</span>دين جديد</button>
          <button data-open="paymentModal"><span>▣</span>تسديد</button>
          <button id="exportBtn"><span>⇩</span>نسخ احتياطي</button>
        </section>

        <nav class="tabs">
          <button class="active" data-tab="debts">الديون</button>
          <button data-tab="customers">العملاء</button>
          <button data-tab="reports">التقارير</button>
        </nav>

        <section class="panel tab-panel active" id="debts">
          <div class="panel-head"><h2>أحدث العمليات</h2><button id="clearSearch">عرض الكل</button></div>
          <div id="transactionsList" class="list"></div>
        </section>

        <section class="panel tab-panel" id="customers">
          <div class="panel-head"><h2>قائمة العملاء</h2><button data-open="customerModal">إضافة</button></div>
          <div id="customersList" class="list"></div>
        </section>

        <section class="panel tab-panel" id="reports">
          <div class="panel-head"><h2>حالة الديون</h2></div>
          <div class="report">
            <div class="donut" id="donut"></div>
            <div><p><span class="dot paid"></span>مدفوع <b id="reportPaid">0</b></p><p><span class="dot left"></span>متبقي <b id="reportLeft">0</b></p></div>
          </div>
        </section>

        <footer class="bottom-nav">
          <button class="active" data-tab="debts">⌂<small>الرئيسية</small></button>
          <button data-tab="customers">👥<small>العملاء</small></button>
          <button data-open="debtModal">＋<small>دين</small></button>
          <button data-tab="reports">▥<small>التقارير</small></button>
          <button data-open="paymentModal">▣<small>تسديد</small></button>
        </footer>
      </section>
    </main>

    <dialog id="customerModal"><form method="dialog" id="customerForm" class="modal-card"><h2>إضافة عميل</h2><input name="name" required placeholder="اسم العميل" /><input name="phone" placeholder="رقم الهاتف" /><textarea name="note" placeholder="ملاحظة"></textarea><menu><button value="cancel">إلغاء</button><button value="save">حفظ</button></menu></form></dialog>
    <dialog id="debtModal"><form method="dialog" id="debtForm" class="modal-card"><h2>دين جديد</h2><select name="customer" required></select><input name="amount" type="number" required min="1" placeholder="المبلغ" /><input name="date" type="date" required /><textarea name="note" placeholder="تفاصيل الدين"></textarea><menu><button value="cancel">إلغاء</button><button value="save">حفظ</button></menu></form></dialog>
    <dialog id="paymentModal"><form method="dialog" id="paymentForm" class="modal-card"><h2>تسجيل تسديد</h2><select name="customer" required></select><input name="amount" type="number" required min="1" placeholder="المبلغ المدفوع" /><input name="date" type="date" required /><textarea name="note" placeholder="ملاحظة"></textarea><menu><button value="cancel">إلغاء</button><button value="save">حفظ</button></menu></form></dialog>
    <script src="app.js"></script>
  </body>
</html>
